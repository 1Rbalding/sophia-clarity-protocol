name: Sophia CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly health check on Sundays

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip

    - name: Validate github-setup.sh syntax
      run: |
        bash -n launch/github-setup.sh
        echo "github-setup.sh syntax OK"

    - name: Run expanded ad-hoc tests
      run: |
        python tests/test_pilot.py

    - name: Run pilot simulation (smoke)
      run: |
        python prototypes/pilot_simulation.py | tail -10
        echo "Pilot simulation completed successfully"
