name: Sophia CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip

    - name: Run expanded ad-hoc tests
      run: |
        python tests/test_pilot.py

    - name: Run pilot simulation (smoke)
      run: |
        python prototypes/pilot_simulation.py | tail -10
